  .nf{padding:110px 0 120px; text-align:center}

  /* A context meter with nothing in it: the joke and the brand in one object. */
  .nf .meter{
    max-width:420px; margin:0 auto 34px; background:var(--bg2);
    border:1px solid var(--line); border-radius:10px; padding:18px 20px; text-align:left;
  }
  .nf .meter .lab{
    display:flex; justify-content:space-between; font-family:var(--mono);
    font-size:11px; letter-spacing:.06em; color:var(--text3); margin-bottom:9px;
  }
  .nf .meter .bar{
    height:13px; border:1px solid var(--line); border-radius:4px;
    background:var(--bg4); overflow:hidden;
  }
