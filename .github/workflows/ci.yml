name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22.5 is the floor (node:sqlite); 22 and 24 are the current LTS lines.
        os: [ubuntu-latest, macos-latest]
        node: ["22.5.0", "22.x", "24.x"]
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # npm 10.8.2, bundled with Node 22.5.0, crashes on `npm ci` with
      # "Exit handler never called!". Fixed in 10.9.0. npm 11 cannot be used here:
      # it requires Node >=22.9, above our floor. Only this job needs the bump;
      # the package has no runtime dependency on npm, so coverage is unaffected.
      - name: Work around the npm crash on the Node floor
        if: matrix.node == '22.5.0'
        run: npm install -g npm@10.9.9
      - run: npm ci
      # `npm run`, never `npx`: npx silently fetches an unrelated package from the
      # registry when the local binary is missing, which is how a failed install
      # turned into executing tsc@2.0.4 from the registry.
      - run: npm run typecheck
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      # The published package is a prebuilt Next app, so verify the tarball a user
      # actually installs, not just the working tree.
      - run: npm pack
      - name: Install the packed tarball and run its CLI
        run: |
          mkdir -p /tmp/pkgtest && cd /tmp/pkgtest
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/contextclues-*.tgz
          ./node_modules/.bin/contextclues --version
          ./node_modules/.bin/contextclues --help >/dev/null
