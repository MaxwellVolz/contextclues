name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Dev toolchain: typecheck and the full suite on the current LTS lines.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22.x", "24.x"]
    name: test · ${{ matrix.os }} · node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # `npm run`, never `npx`: npx silently fetches an unrelated package from the
      # registry when the local binary is missing, which is how an earlier failed
      # install turned into executing tsc@2.0.4 from the registry.
      - run: npm run typecheck
      - run: npm test

  build:
    runs-on: ubuntu-latest
    name: build + pack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: contextclues-*.tgz
          retention-days: 1

  # The floor job verifies the promise in `engines`: that the package a user
  # installs runs on Node 22.13.0, the first release where node:sqlite works unflagged
  # (it existed from 22.5 but required --experimental-sqlite until 22.13).
  #
  # It deliberately does NOT install the dev toolchain. npm 10.8.2, bundled with
  # older Node 22, crashes on `npm ci` ("Exit handler never called!"), and that npm
  # bug says nothing about whether ContextClues works. Installing the packed
  # tarball exercises the real contract: four runtime dependencies and the CLI.
  floor:
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    name: floor · ${{ matrix.os }} · node 22.13.0
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - uses: actions/download-artifact@v4
        with:
          name: package-tarball
      - name: Install the packed tarball
        run: |
          mkdir -p /tmp/floor && cd /tmp/floor
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/contextclues-*.tgz
      - name: node:sqlite is present on this runtime
        run: node -e "const {DatabaseSync}=require('node:sqlite'); new DatabaseSync(':memory:').exec('create table t(a)'); console.log('node:sqlite ok on', process.version)"
      - name: The CLI runs
        run: |
          cd /tmp/floor
          ./node_modules/.bin/contextclues --version
          ./node_modules/.bin/contextclues --help > /dev/null
      - name: The server boots and serves the API
        run: |
          cd /tmp/floor
          ./node_modules/.bin/contextclues --port 4399 --no-open > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf --max-time 2 http://127.0.0.1:4399/api/cases > /dev/null; then
              echo "server responded on attempt $i"
              curl -s http://127.0.0.1:4399/api/cases
              exit 0
            fi
            sleep 2
          done
          echo "server never became ready"; cat server.log; exit 1
